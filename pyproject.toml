[project]
name = "tsukuyomichan-llm-ft"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bitsandbytes>=0.48.2",
    "datasets>=4.4.1",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "peft>=0.18.0",
    "protobuf>=6.33.1",
    "requests>=2.32.5",
    "sentencepiece>=0.2.1",
    "torch>=2.9.1",
    "trl>=0.25.1",
]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.1",
    "black>=25.11.0",
    "ruff>=0.14.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--cov=.",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = '''
/(
  | llama\.cpp
  | data
  | results
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "llama.cpp",
    "data",
    "results",
]
